name: General Issue
description: Use this for general tasks, technical debt, documentation, or discussions.
title: "[Task]: "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the task, question, or improvement in detail.
      placeholder: What needs to be done or discussed?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context & Motivation
      description: Why is this necessary? Provide any relevant background, links, or references.
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: Action Items / To-Do
      description: If applicable, list the steps required to complete this issue. Use checkboxes.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: false

  - type: input
    id: related-issues
    attributes:
      label: Related Issues or Epics
      description: Link any related issues, PRs, or Epics to maintain traceability (e.g., #12).
      placeholder: "#"
    validations:
      required: false
