name: General Issue
description: Use this for general tasks, technical debt, documentation, or discussions.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please describe the task, question, or improvement in detail, including context and motivation.
      placeholder: What needs to be done and why is it necessary?
    validations:
      required: true

  - type: textarea
    id: development-tasks
    attributes:
      label: Development Tasks
      description: List the steps required to complete this issue.
      value: |
        - 
        - 
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the requirements and tests that must pass for this task to be considered complete.
      value: |
        - 
        - 
    validations:
      required: false

  - type: input
    id: related-issues
    attributes:
      label: Related Issues
      description: Link any related issues or PRs to maintain traceability.
      placeholder: "#"
    validations:
      required: false